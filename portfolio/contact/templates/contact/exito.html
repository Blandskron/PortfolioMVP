{% extends 'base.html' %}

{% block title %}Gracias{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h2 class="text-center mb-4">Gracias por contactarnos</h2>
                    <p class="text-center">Tu mensaje ha sido enviado correctamente. Nos pondremos en contacto contigo pronto.</p>
                    <div class="text-center mt-4">
                        <a href="{% url 'contacto' %}" class="btn btn-secondary">Volver al formulario</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
